{% extends "base.html" %}
{% block titulo %}Contraseña actualizada{% endblock %}
{% block contenido %}
<div class="login-wrapper">
    <div class="card login-card shadow-lg">
        <div class="card-body p-4 p-md-5 text-center">
            <i class="bi bi-check-circle text-success" style="font-size: 2.5rem;"></i>
            <h5 class="mt-3">Su contraseña fue actualizada</h5>
            <p class="text-muted small">Ya puede iniciar sesión con su nueva contraseña.</p>
            <a href="{% url 'usuarios:login' %}" class="btn btn-primary">Iniciar sesión</a>
        </div>
    </div>
</div>
{% endblock %}
